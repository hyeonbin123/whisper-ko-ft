# [역할] push와 pull request마다 린트(ruff)와 테스트(pytest)를 돌린다. GPU가 없는 GitHub 러너에서 돌므로,
# 모델을 내려받거나 GPU로 측정하는 일은 하지 않는다. 테스트는 작은 무작위 모델, 가짜 모델, 커밋된 리포트의 다시
# 채점만으로 돈다(tests/ 각 파일 머리 주석).
# [확인하는 것] 커밋된 리포트(reports/)를 지금 코드로 다시 채점해 기록된 수치와 같은지(tests/test_recorded_reports.py),
# 판정 도구(analyze)와 측정 하네스의 동작, faster-whisper 경로의 멜 필터 수와 빈 가설 기준(tests/test_ct2_features.py).
# faster-whisper 묶음이 실제로 import되는지는 Test 앞 단계가 따로 확인한다.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # ubuntu-latest는 2026-10-19부터 Ubuntu 26으로 바뀌므로, 실행 환경이 예고 없이 바뀌지 않게 버전을 고정한다.
    runs-on: ubuntu-24.04
    # GITHUB_TOKEN 권한을 읽기 전용으로 적어 둔다. 이 작업은 저장소를 받아(checkout) 린트·테스트만 하고 비밀값도
    # 쓰지 않는다. 지금은 저장소 설정의 기본값도 읽기 전용이지만, 그 설정은 workflow 밖에 있어 바뀌어도 여기서는
    # 보이지 않는다. permissions를 적으면 적지 않은 권한(packages 등)은 모두 none이 된다(metadata 읽기는 늘 있다).
    permissions:
      contents: read
    steps:
      # 외부 action은 태그가 아니라 전체 커밋 SHA로 고정한다. 태그는 떠 있는 주 버전 태그(v7)든 릴리스 태그
      # (v10.2.0)든 action 저장소 쪽에서 다른 커밋으로 옮길 수 있어, 그러면 이 파일이 그대로여도 다른 코드가 돈다.
      # 커밋 SHA는 옮길 수 없다. 줄 끝 주석은 그 SHA의 릴리스 판이다(2026-10-29 확인: v7 태그는 v7.0.1과 같은
      # 커밋을 가리켰고, SHA로 고정하기 전 마지막 CI도 이 두 SHA로 돌았다). 자동 갱신 도구는 쓰지 않으므로 판을
      # 올릴 때는 손으로 바꾼다: `gh api repos/<owner>/<repo>/git/ref/tags/<tag>`의 object.sha를 쓰되, object.type이
      # tag(주석 달린 태그)이면 `gh api repos/<owner>/<repo>/git/tags/<그 sha>`로 한 번 더 따라가 커밋 SHA를 쓰고,
      # SHA와 판 주석을 함께 바꾼다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # setup-uv는 v8부터 떠 있는 주 버전 태그(v10 같은)를 내지 않아 정확한 릴리스(v10.2.0)의 커밋으로 고정한다.
      # v6부터 python-version만으로는 가상환경이 켜지지 않는다. 아래 `uv pip install`은 켜진 가상환경이 필요하고,
      # `uv run`도 같은 .venv를 쓰므로 activate-environment를 켠다.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.11"
          activate-environment: true
      # 설치 방식과 이유:
      # - uv.lock은 학습용으로 torch를 CUDA 12.8 빌드로 고정한다. 테스트에는 GPU가 필요 없으므로 잠긴 torch와
      #   같은 버전의 CPU 빌드를 PyTorch CPU 인덱스에서 받는다(`+cu128` 꼬리를 떼고 버전만 남긴다). CUDA 빌드는
      #   수 GB라 러너 디스크와 시간을 낭비한다.
      # - 나머지는 잠긴 버전 그대로 설치하되, CUDA 빌드에만 필요한 리눅스 전용 휠(nvidia-*, triton, cuda-*)은
      #   뺀다.
      # - `--group ct2`: faster-whisper 묶음(faster-whisper, ctranslate2, onnxruntime, av 등 잠긴 버전)도
      #   설치한다. 그래야 tests/test_ct2_features.py에서 `pytest.importorskip("faster_whisper")`로 시작하는
      #   evaluate_ct2 테스트(2026-10-29 기준 함수 10개, 매개변수 경우까지 14건: turbo의 멜 128개 경로, 속도
      #   측정용 --no-report, 빈 가설 기준, 빈 묶음·NaN 리포트 거부, 모델 폴더 해시·시드 기록 등)가 건너뛰어지지
      #   않고 CI에서 돈다(건너뛰지 않는 것은 Test 앞의 import 확인 단계가 강제한다). 이 테스트들은 faster_whisper의
      #   WhisperModel을 가짜로 바꿔 쓰고 특징 추출기(numpy)만 실제로 만들어서, 모델을 내려받지 않고 GPU도
      #   쓰지 않는다. ctranslate2 리눅스 휠은 CUDA 라이브러리를 실제로 GPU를 쓸 때만 불러오므로 CPU 러너에서
      #   import가 된다. evaluate_ct2가 torch lib 폴더를 DLL 검색 경로에 넣는 처리는 Windows(os.name == "nt")에서만
      #   돈다.
      # - `--locked`: uv.lock이 pyproject.toml과 맞지 않으면(잠금 파일을 갱신하지 않고 의존성을 바꾸면) 여기서
      #   실패한다.
      # - 마지막 줄은 이 저장소 패키지(whisper_ko_ft)를 의존성 없이 편집 가능 모드로 설치한다(의존성은 위에서
      #   잠긴 버전으로 이미 설치했다).
      - name: Install
        shell: bash
        run: |
          uv export --locked --no-hashes --no-annotate --no-emit-project --group dev --group ct2 -o "$RUNNER_TEMP/locked.txt"
          grep -E '^torch==' "$RUNNER_TEMP/locked.txt" | sed -E 's/\+cu[0-9]+//; s/ *;.*//' > "$RUNNER_TEMP/torch.txt"
          test -s "$RUNNER_TEMP/torch.txt"
          grep -vE '^(torch==|nvidia-|triton==|cuda-)' "$RUNNER_TEMP/locked.txt" > "$RUNNER_TEMP/rest.txt"
          uv pip install -r "$RUNNER_TEMP/torch.txt" --index-url https://download.pytorch.org/whl/cpu
          uv pip install -r "$RUNNER_TEMP/rest.txt"
          uv pip install --no-deps -e .
      # 린트: 규칙 위반(ruff check)과 서식(ruff format --check). `--no-sync`는 uv run이 uv.lock대로 다시
      # 설치하지 않게 한다(그러면 CUDA torch를 받으려 한다).
      - name: Lint
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
      # faster-whisper 묶음 import 확인. 위 evaluate_ct2 테스트는 `pytest.importorskip("faster_whisper")`로
      # 시작해서, faster_whisper나 그것이 불러오는 모듈(ctranslate2 등)이 설치되지 않아 ModuleNotFoundError가 나면
      # 실패하지 않고 건너뛰어진다. `pytest -rs`는 건너뛴 이유를 찍기만 하고 CI는 통과하므로, 묶음 설치가 빠지면
      # 이 테스트들이 조용히 사라진다(f5fe746 전에는 ct2 묶음을 설치하지 않아 CI에서 늘 건너뛰었다). 이 단계가
      # 테스트 전에 직접 import해서 그런 경우 CI를 여기서 실패시킨다. pytest 9의 importorskip은
      # ModuleNotFoundError만 건너뛰므로, 공유 라이브러리를 열지 못하는 것 같은 다른 ImportError는 이 단계가
      # 없어도 테스트 실패로 드러난다.
      - name: Check the faster-whisper import
        run: uv run --no-sync python -c "import faster_whisper, ctranslate2"
      # 테스트: 모든 pytest. ct2 묶음을 설치했고 바로 앞 단계가 import를 확인했으므로 faster-whisper가 필요한
      # 테스트도 건너뛰지 않는다. 건너뛰는 테스트는 Hugging Face 캐시에 실제 Qwen3-ASR 처리기가 있을 때만 도는
      # 것뿐이다(러너에는 캐시가 없고, 모델을 내려받지 않는다).
      - name: Test
        run: uv run --no-sync pytest -rs
