name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      # The project pins torch to the CUDA 12.8 index for training. The tests need no GPU, so CI installs
      # the CPU build first and then the project without touching torch again.
      - name: Install
        run: |
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install -e . pytest ruff
      - name: Lint
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
      - name: Test
        run: uv run --no-sync pytest
