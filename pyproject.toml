[project]
name = "whisper-ko-ft"
version = "0.1.0"
description = "Fine-tune Whisper on public Korean speech and measure what it gains and loses"
requires-python = ">=3.11,<3.13"
dependencies = [
    "accelerate>=1.0",
    "httpx>=0.28",
    "jiwer>=4.0",
    "numpy>=2.0",
    "peft>=0.13",
    "pyarrow>=18",
    "scipy>=1.14",
    "soundfile>=0.13",
    "torch>=2.7",
    "transformers>=4.57",
]

[dependency-groups]
ct2 = [
    "faster-whisper>=1.2",
]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whisper_ko_ft"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
